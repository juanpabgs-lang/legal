name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: norfront
          POSTGRES_PASSWORD: norfront
          POSTGRES_DB: norfront_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U norfront"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://norfront:norfront@localhost:5432/norfront_test
      TEST_DATABASE_URL: postgres://norfront:norfront@localhost:5432/norfront_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
